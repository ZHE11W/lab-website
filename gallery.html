<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gallery of Wang-Timmy ME-Lab team photos and team building activities."
    />
    <title>Gallery | Wang-Timmy ME-Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="index.html" aria-label="Wang-Timmy ME-Lab home">
        <span>
          <strong>Wang-Timmy ME-Lab</strong>
          <small>Environmental Microbiome & Ecological Intelligence</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" aria-label="Primary navigation" data-nav>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="people.html">People</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="gallery-page">
      <section class="gallery-section" aria-labelledby="team-photos">
        <h1 id="team-photos">Team photos</h1>

        <div class="gallery-grid">
          <figure class="gallery-item">
            <button class="gallery-image-button" type="button" data-lightbox-src="assets/gallery-team-2026-01.png">
              <img src="assets/gallery-team-2026-01.png" alt="Wang-Timmy ME-Lab team dinner in January 2026" />
            </button>
            <figcaption>2026.1</figcaption>
          </figure>
          <figure class="gallery-item">
            <button class="gallery-image-button" type="button" data-lightbox-src="assets/gallery-team-2026-02.png">
              <img src="assets/gallery-team-2026-02.png" alt="Wang-Timmy ME-Lab gallery photo" />
            </button>
            <figcaption>2026.6</figcaption>
          </figure>
        </div>
      </section>

      <section class="gallery-section gallery-activities" aria-labelledby="team-building">
        <h2 id="team-building">Team building activities</h2>
        <div class="gallery-empty">
          <span>More photos coming soon</span>
        </div>
      </section>
    </main>

    <div class="image-lightbox" data-lightbox hidden>
      <button class="image-lightbox-close" type="button" aria-label="Close enlarged image" data-lightbox-close>&times;</button>
      <img src="" alt="" data-lightbox-image />
    </div>

    <footer class="site-footer">
      <p>&copy; Wang-Timmy ME-Lab, Hangzhou Normal University</p>
      <p>Environmental Microbiome & Ecological Intelligence</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
